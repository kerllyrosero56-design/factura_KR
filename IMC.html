<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMULADOR DE IMC</title>
    <link rel="stylesheet" href="main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>SIMULADOR DE IMC</h1>

    <form id="formulario" class="container bg-light p-4 rounded shadow-sm">
        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" name="peso" step="0.1" min="1" required><br><br>

        <label for="altura">Altura (m):</label>
        <input type="number" id="altura" name="altura" step="0.01" min="0.1" required><br><br>

        <button type="submit" id="botonCalcular">Calcular IMC</button> 
    </form>

    <h2 id="resultado">RESULTADO</h2>
    
    <script src="doc.js"></script>
</body>
</html>
