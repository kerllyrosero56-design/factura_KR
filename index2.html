<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Repetitivas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container my-4">

    <h4 id="resultado" class="text-danger mb-3">Resultado</h4>

    <table class="table table-bordered table-striped align-middle">
        <thead class="table-danger">
            <tr>
                <th>Número</th>
                <th>Multiplicador</th>
                <th>Resultado</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
        </tbody>
    </table>
    
    <div class="card p-3 mb-4 bg-primary text-white shadow-sm">
        <h3 class="h5">Suma de dos números</h3>
        <div class="row g-2 align-items-center">
            <div class="col-auto">
                <input type="number" id="num1" class="form-control" placeholder="Número 1">
            </div>
            <div class="col-auto">
                <input type="number" id="num2" class="form-control" placeholder="Número 2">
            </div>
            <div class="col-auto">
                <button id="resulSuma" class="btn btn-dark">Calcular Suma</button>
            </div>
        </div>
    </div>

    <script src="ciclos.js"></script>
</body>
</html>
