<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Factura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="factura.js" defer></script>
</head>
<body class="bg-light">
    <div class="container my-4 p-4 bg-danger text-white ">
        <h2>FACTURA LICO</h2>

        <!-- CLIENTE -->
        <section class="mb-3">
            <div class="bg-secondary ">
                <div class="row g-2">
                    <div class="col-md-4">
                        <label>Cliente:</label>
                        <input type="text" id="cliente"/>
                    </div>
                    <div class="col-md-4">
                        <label">Cédula:</label>
                        <input type="text" id="cedula"/>
                    </div>
                    <div class="col-md-4">
                        <label>Sexo:</label>
                        <input type="text" id="sexo"/>
                    </div>
                </div>
            </div>
        </section>

        <!-- PRODUCTOS -->
        <section>
            <div class="bg-dark text-white mb-3">
                <h4>Agregar Producto</h4>
                <div class="row g-2 align-items-end">
                    <div class="col-md-4">
                        <label >Producto:</label>
                        <input type="text" id="producto"/>
                    </div>
                    <div class="col-md-3">
                        <label>Cantidad:</label>
                        <input type="number" id="cantidad" min="1"/>
                    </div>
                    <div class="col-md-3">
                        <label>Precio ($):</label>
                        <input type="number" id="precio" step="0.01" min="0"/>
                    </div>
                    <div class="col-md-2">
                        <button id="btnagregar">Agregar</button>
                    </div>
                </div>
            </div>

            <div class="bg-white text-dark shadow-sm">
                <h5 class="mb-3 text-danger fw-bold">LISTA DE PRODUCTOS</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-bordered table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Producto</th>
                                <th>Cantidad</th>
                                <th>Precio</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="detalleFac">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white text-dark shadow-sm">
                <h5 class="mb-3 text-danger fw-bold">PRECIO FINAL</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-bordered table-hover align-middle mb-0">
                        <thead class="table-secondary">
                            <tr>
                                <th>Subtotal</th>
                                <th>IVA </th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="totalesFac">
                            <tr>
                                <td id="resSubtotal"></td>
                                <td id="resIVA"></td>
                                <td id="resTotal" class="fw-bold"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
