<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control de Acceso Sencillo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
   <script src="formulario.js" defer></script>
</head>
<body class="container py-4">

  <div class="col-md-6 mx-auto card p-4">
    <h3>Control de Acceso</h3>

    <div class="mb-3">
      <label class="form-label">Nombre:</label>
      <input type="text" id="nombre" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Edad:</label>
      <input type="number" id="edad" class="form-control">
    </div>

    <button onclick="verificarAcceso()" class="btn btn-danger">Verificar</button>

    <div id="mensajeResultado" class="mt-3 fw-bold"></div>
  </div>

</body>
</html>
